name: PocketPrint
options:
  bundleIdPrefix: com.pocketprint
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  PocketPrint:
    type: application
    platform: iOS
    sources:
      - path: PocketPrint
    info:
      path: PocketPrint/Info.plist
      properties:
        CFBundleDisplayName: PocketPrint
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        NSBluetoothAlwaysUsageDescription: PocketPrint uses Bluetooth to connect to your mini thermal printer.
        NSCameraUsageDescription: Take a photo to print it or to scan text from it.
        NSPhotoLibraryAddUsageDescription: Save print previews to your photo library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketprint.app
        PRODUCT_NAME: PocketPrint
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES

  PocketPrintTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketPrintTests
    dependencies:
      - target: PocketPrint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketprint.app.tests
        GENERATE_INFOPLIST_FILE: YES

  PocketPrintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PocketPrintUITests
    dependencies:
      - target: PocketPrint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketprint.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PocketPrint

schemes:
  PocketPrint:
    build:
      targets:
        PocketPrint: all
        PocketPrintTests: [test]
        PocketPrintUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketPrintTests
        - PocketPrintUITests
    archive:
      config: Release
